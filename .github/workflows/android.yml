name: Android CI & Build APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant Execute Permission for Gradlew
      run: chmod +x gradlew

    - name: Validate & Repair Gradle Wrapper
      run: |
        if ! jar tf gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
          echo "Gradle wrapper jar is corrupt or missing. Regenerating..."
          gradle wrapper --gradle-version 8.13 || gradle wrapper
          chmod +x gradlew
        fi

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug || gradle assembleDebug

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: baby-app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
